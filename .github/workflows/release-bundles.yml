name: Build release bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build dev image
        run: docker build -t nvmr-dev docker
      - name: Build static bundle
        run: scripts/d.sh sh -c 'touch src/*.rs src/bin/*.rs && sh /src/scripts/bundle.sh'
      - name: Smoke test installed bundle
        run: |
          docker run --rm -v "$PWD":/src:ro nvmr-dev sh -eu -c '
            export HOME=/tmp/nvmr-release-smoke PROFILE=/dev/null
            export NVM_DIR="$HOME/.nvm"
            NVMR_BUNDLE=/src/dist/nvmr-linux-$(uname -m) sh /src/install.sh
            . "$HOME/.nvm/nvm.sh" --no-use
            nvm --version
            nvm current
          '
      - name: Check bundle and checksum
        run: |
          test -s "dist/nvmr-linux-${{ matrix.arch }}.tar.gz"
          sudo chown -R "$(id -u):$(id -g)" dist
          sha256sum "dist/nvmr-linux-${{ matrix.arch }}.tar.gz" > "dist/nvmr-linux-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: nvmr-linux-${{ matrix.arch }}
          path: |
            dist/nvmr-linux-${{ matrix.arch }}.tar.gz
            dist/nvmr-linux-${{ matrix.arch }}.tar.gz.sha256

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build native bundle
        run: |
          cargo build --release --locked
          bundle="dist/nvmr-darwin-${{ matrix.arch }}"
          mkdir -p "$bundle"
          cp target/release/nvmr target/release/nvmr-fetch \
            nvm.sh nvm.fish nvm-exec bash_completion "$bundle/"
          tar -czf "$bundle.tar.gz" -C "$bundle" .
      - name: Smoke test installed bundle
        run: |
          export HOME="$RUNNER_TEMP/nvmr-release-smoke"
          export NVM_DIR="$HOME/.nvm" PROFILE=/dev/null
          NVMR_BUNDLE="dist/nvmr-darwin-${{ matrix.arch }}" sh install.sh
          bash -c '. "$NVM_DIR/nvm.sh" --no-use; nvm --version; nvm current'
      - name: Check bundle and checksum
        run: |
          test -s "dist/nvmr-darwin-${{ matrix.arch }}.tar.gz"
          shasum -a 256 "dist/nvmr-darwin-${{ matrix.arch }}.tar.gz" > "dist/nvmr-darwin-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: nvmr-darwin-${{ matrix.arch }}
          path: |
            dist/nvmr-darwin-${{ matrix.arch }}.tar.gz
            dist/nvmr-darwin-${{ matrix.arch }}.tar.gz.sha256
