[package]
name = "nvmr"
version = "0.1.0"
edition = "2021"
default-run = "nvmr"

[[bin]]
name = "nvmr"
path = "src/main.rs"

[[bin]]
name = "nvmr-fetch"
path = "src/bin/nvmr-fetch.rs"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
liblzma = { version = "0.4", features = ["static"] }
ctrlc = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
